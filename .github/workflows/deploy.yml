name: CI/CD Automatic Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build:shared

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 'ee83c3ab71a1887dba11dc82414f543a'
          workingDirectory: 'backend'

  deploy-frontend:
    name: Deploy Frontend Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package & Frontend
        run: |
          npm run build:shared
          npm run build -w @jobpilot/frontend

      - name: Deploy Pages to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 'ee83c3ab71a1887dba11dc82414f543a'
          command: pages deploy dist --project-name=jobpilot-3lg
          workingDirectory: 'frontend'
