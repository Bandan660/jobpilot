<!--
  The source of truth for every BanApply icon.

  WHY A VECTOR AND NOT THE GENERATED PNG

  The mark is a rounded square and a rhombus. Rasterising that from a
  1254x1254 image down to 16x16 throws away the one thing that matters at that
  size — a clean edge — and carries three faults the generator introduced:

    - the amber came out #FBA10F and the ground #050A17, neither of which is a
      BanApply colour. Side by side with the site the icon would read as a
      near-miss, which is worse than an obvious difference;
    - the corners were opaque white, not transparent, so the rounded square sat
      on four white triangles. Invisible on a white page and glaring in a dark
      toolbar, which is exactly where this lives;
    - every edge carried the generator's own antialiasing, which compounds with
      the antialiasing of the downscale.

  Redrawn here at the geometry that was approved — 56.9% wide, 74.4% tall,
  centred, 16.8% corner radius, all measured off that image — in the exact
  tokens from frontend/src/styles/tokens.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="21.5" fill="#080D16"/>
  <path d="M64 16.4 L100.4 64 L64 111.6 L27.6 64 Z" fill="#FFB020"/>
</svg>
