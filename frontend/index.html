<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BanApply" />
    <!-- iOS has no maskable icon support and no manifest theme_color; it reads
         these instead. black-translucent lets the header sit under the status
         bar, which the safe-area rules then pad for. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d16" />

    <!--
      Applies a saved theme choice before first paint. Without this the page
      renders in the OS theme for one frame and then snaps to the chosen one.
      Deliberately tiny and dependency-free: it runs before the bundle loads.
    -->
    <script>
      try {
        var saved = localStorage.getItem('banapply.theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        /* private mode or storage disabled — fall back to the OS preference */
      }
    </script>

    <!-- Per-route titles and descriptions are set by usePageMeta; these are the
         defaults a crawler sees before the app boots. -->
    <title>BanApply — a job tracker that updates itself</title>
    <meta
      name="description"
      content="BanApply records every job application from your browser, warns you before you apply twice, and tells you when a posting comes down."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="BanApply — a job tracker that updates itself" />
    <meta
      property="og:description"
      content="Apply like normal. BanApply captures the application, catches duplicates, and flags postings that have gone down."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Google Analytics (gtag.js).

      Last in the head on purpose. Everything above it is either a tag the
      crawler needs or the theme script, which has to run before first paint;
      a third-party script ahead of those competes with them for the main
      thread during exactly the window LCP is measured in.

      `async` keeps it off the critical path, but it is not free — this is the
      one third-party script on a site that dropped three.js and GSAP over
      main-thread cost. If the Lighthouse performance score moves, this is the
      first thing to suspect.

      The prerenderer uses dist/index.html as its template and replaces only
      the root div and the meta tags, so this lands on every prerendered route.
      The service worker ignores cross-origin requests, so it does not touch it.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9KTB0DKZN1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-9KTB0DKZN1');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
