name = "jobpilot-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.banapply.com", custom_domain = true }
]

# Dead-posting checker. Every 6 hours; each run processes one batch.
# Cron Triggers are included on the Workers free plan.
[triggers]
crons = ["0 */6 * * *"]

[vars]
# Non-secret config. Secrets (DATABASE_URL, JWT_SECRET) are set separately:
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put JWT_SECRET
# For local dev they go in backend/.dev.vars instead.
# Exact origins allowed to call the API from a browser.
#
# Production only. The localhost entries that used to be here let a page served
# from any local dev server on a user's machine call the live API from their
# browser — and local development does not need them, because `npm run dev:api`
# points the site at localhost:8787 rather than at this Worker. Put them in
# backend/.dev.vars if a local client ever has to talk to production.
CORS_ORIGINS = "https://banapply.com,https://www.banapply.com,https://jobpilot-3lg.pages.dev"

# Host suffixes, for Pages preview deployments whose hostname is per-build
# (<hash>.jobpilot-3lg.pages.dev) and cannot be listed in advance.
#
# Must include the leading dot AND the project subdomain. A bare ".pages.dev"
# would let any Pages site on the internet call this API.
CORS_ORIGIN_SUFFIXES = ".jobpilot-3lg.pages.dev"
POSTING_RECHECK_AFTER_HOURS = "24"
POSTING_CHECK_BATCH_SIZE = "25"
GHOST_AFTER_DAYS = "30"

# Resume storage. R2 has no egress fee, which matters because every autofill
# that attaches a resume reads the object back out.
[[r2_buckets]]
binding = "RESUMES"
bucket_name = "jobpilot-resumes"

# Per-IP rate limits. See middleware/rateLimit.ts for what each one defends.
#
# namespace_id is an arbitrary number that identifies the counter within this
# Worker; it is not a resource to create in the dashboard. Changing one resets
# its counters, which is the only reason to change one.
#
# The auth limit is generous enough that a person mistyping a password never
# meets it, and tight enough that guessing at scale from one address is
# pointless. Reports are hourly because a human files one every few weeks.
[[unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "REPORT_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 3600 }

[observability]
enabled = true
