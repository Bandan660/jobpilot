name = "jobpilot-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Dead-posting checker. Every 6 hours; each run processes one batch.
# Cron Triggers are included on the Workers free plan.
[triggers]
crons = ["0 */6 * * *"]

[vars]
# Non-secret config. Secrets (DATABASE_URL, JWT_SECRET) are set separately:
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put JWT_SECRET
# For local dev they go in backend/.dev.vars instead.
# Exact-match list. Preview deployments get a per-build subdomain
# (<hash>.jobpilot-3lg.pages.dev) and are deliberately not included — a
# wildcard here would let any Pages project on the account call this API.
CORS_ORIGINS = "https://jobpilot-3lg.pages.dev,http://localhost:5173,http://127.0.0.1:5173"
POSTING_RECHECK_AFTER_HOURS = "24"
POSTING_CHECK_BATCH_SIZE = "25"
GHOST_AFTER_DAYS = "30"

[observability]
enabled = true
